<!DOCTYPE html>
<html>
<head>
    <title>Test</title>
    <style>
        body { 
            margin: 0; 
            padding: 20px;
            font-family: Arial;
            height: 200vh;
            background: linear-gradient(to bottom, #fff, #c4c4b0);
        }
        .scroll-btn {
            position: fixed;
            left: 2rem;
            top: 50%;
            width: 50px;
            height: 50px;
            background: rgba(0,0,0,0.75);
            border: none;
            border-radius: 50%;
            color: white;
            cursor: pointer;
            display: none;
            z-index: 999;
        }
        .scroll-btn.visible {
            display: block;
        }
        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: white;
            padding: 1rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            z-index: 100;
        }
        nav a {
            margin: 0 1rem;
            text-decoration: none;
            color: black;
        }
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: rgb(196, 196, 176);
            z-index: -1;
            opacity: 0;
            display: none;
            padding: 3rem;
        }
        .overlay.active {
            z-index: 200;
            opacity: 1;
            display: block;
        }
        .close-btn {
            position: absolute;
            top: 2rem;
            right: 2rem;
            width: 40px;
            height: 40px;
            background: black;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 20px;
        }
        .content {
            padding-top: 80px;
        }
    </style>
</head>
<body>
    <nav>
        <a href="#home">Home</a>
        <a href="#contact" id="contactLink">Contact</a>
    </nav>

    <button class="scroll-btn" id="scrollBtn">↑</button>

    <div class="content">
        <h1>Test Page</h1>
        <p>Scroll down to see the button appear...</p>
        <p style="margin-top: 100vh;">Keep scrolling...</p>
    </div>

    <div class="overlay" id="contactOverlay">
        <button class="close-btn" id="closeBtn">×</button>
        <h1>Contact Page</h1>
        <p>This is the contact overlay!</p>
        <p>Email: test@test.com</p>
    </div>

    <script>
        // Scroll button
        const scrollBtn = document.getElementById('scrollBtn');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 300) {
                scrollBtn.classList.add('visible');
            } else {
                scrollBtn.classList.remove('visible');
            }
        });
        scrollBtn.addEventListener('click', () => {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        // Contact overlay
        const contactLink = document.getElementById('contactLink');
        const contactOverlay = document.getElementById('contactOverlay');
        const closeBtn = document.getElementById('closeBtn');

        contactLink.addEventListener('click', (e) => {
            e.preventDefault();
            contactOverlay.classList.add('active');
        });

        closeBtn.addEventListener('click', () => {
            contactOverlay.classList.remove('active');
        });

        console.log('Test page loaded successfully!');
    </script>
</body>
</html>
